<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu4U - Orders Dashboard</title>
  <link rel="stylesheet" href="order.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="dashboard-container">

    <aside class="sidebar">
      <div class="brand">
        <div class="logo-grid">
          <div></div><div></div><div></div><div></div>
        </div>
        <span class="brand-name">Menu4U</span>
        <span class="brand-sub">vamos almoçar 2</span>
      </div>

      <div class="nav-section">
        <p class="section-title">Management</p>
        <nav>
          <a href="../estatistics/estatistics.html" class="nav-item">Estatísticas</a>
          <a href="../menu_editor/menu.html"         class="nav-item">Menu editor</a>
          <a href="../QR-Code/QR.html"               class="nav-item">QR code</a>
          <a href="../orders/order.html"             class="nav-item active">Orders</a>
        </nav>
      </div>

      <div class="nav-section">
        <p class="section-title">Account</p>
        <nav>
          <a href="#" class="nav-item">Profile</a>
          <a href="#" class="nav-item">Settings</a>
        </nav>
      </div>
    </aside>

    <main class="main-content">

      <header class="main-header">
        <div class="header-left">
          <h1>Orders</h1>
          <div class="status-badge">
            <span class="pulse-dot" id="realtime-dot"></span>
            <span class="status-text" id="realtime-text">connecting…</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn btn-outline" id="refresh-btn">🔄 Refresh</button>
          <a href="../" class="btn btn-outline">Main Page</a>
        </div>
      </header>

      <div class="dashboard-body">

        <!-- Metrics -->
        <section class="metrics-grid">
          <div class="metric-card">
            <span class="card-title">Total today</span>
            <span class="card-value" id="metric-total">—</span>
          </div>
          <div class="metric-card">
            <span class="card-title">Pending</span>
            <span class="card-value amber" id="metric-pending">—</span>
          </div>
          <div class="metric-card">
            <span class="card-title">Done</span>
            <span class="card-value emerald" id="metric-done">—</span>
          </div>
          <div class="metric-card">
            <span class="card-title">Revenue</span>
            <span class="card-value" id="metric-revenue">—</span>
          </div>
        </section>

        
        <!-- Printer -->
        <section class="printer-card">
          <div class="printer-status">
            <span class="printer-icon">🖨️</span>
            <span class="dot-indicator" id="printer-dot"></span>
            <span id="printer-status-text">No printer connected</span>
          </div>
          <div class="printer-actions">
            <button class="btn btn-printer" id="printer-toggle">Connect printer</button>
            <span class="printer-note">Connect a printer to print receipts</span>
          </div>
        </section>

        <!-- Orders Cards Grid -->
        <section id="orders-grid" class="orders-grid hidden"></section>

        <!-- Empty / Error state -->
        <div class="empty-state" id="error-state">
          <p id="error-message">No orders yet today. They will appear here in real time.</p>
        </div>

      </div>
    </main>

  </div>

  <script src="order.js"></script>
</body>
</html>
