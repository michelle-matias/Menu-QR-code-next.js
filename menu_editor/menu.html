<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Editor </title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="menu.css">
</head>

<body class="dashboard-body">

    <header class="top-bar">
        <div class="logo">
            <i class="fas fa-qrcode"></i> Menu4U
        </div>
        <div class="nav-right">
            <a href="../estatistics/estatistics.html" class="btn-home-nav">Main Page</a>
        </div>
    </header>

    <div class="main-layout">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <div class="section-title">MANAGEMENT</div>
            <ul>
                <li><a href="../estatistics/estatistics.html"><i class="fas fa-chart-line"></i> Estatístics</a></li>
                <li class="active" ><a href="../menu_editor/menu.html"><i class="fas fa-bars"></i> Menu editor</a></li>
                <li><a href="../QR-Code/QR.html"><i class="fas fa-qrcode"></i> QR code</a></li>
                <li><a href="../orders/order.html"><i class="fas fa-clipboard-list"></i> Orders</a></li>
            </ul>

            <div class="section-title">ACCOUNT</div>
            <ul>
                <li><a href="#"><i class="far fa-user"></i> Profile</a></li>
                <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </aside>


        <main class="content-area">

            <div class="header-inline">
                <h1>Menu Editor</h1>

                <div class="buttons">
                    <button class="seu-botao-estilo" onclick="previewMenu()">
                        Preview Menu
                    </button>
                    <button class="btn-primary" onclick="openModal()">+ Add Dish</button>
                </div>
            </div>

            <canvas id="qr"></canvas>

            <div id="menuContainer"></div>

        </main>

        <div class="modal" id="dishModal">
            <div class="modal-content">
                <button id="modalTitle" class="btn-primary">Add Dish</button>

                <form id="dishForm">

                    <div class="input-group">
                        <label>Dish Name</label>
                        <input type="text" id="dishName" required>
                    </div>

                    <div class="input-group">
                        <label>Description</label>
                        <textarea id="dishDescription" required></textarea>
                    </div>

                    <div class="input-group">
                        <label>Price (€)</label>
                        <input type="number" id="dishPrice" step="0.01" required>
                    </div>

                    <div class="input-group">
                        <label>Category</label>
                        <select id="dishCategory" required>
                            <option value="Starters">Starters</option>
                            <option value="Mains">Mains</option>
                            <option value="Desserts">Desserts</option>
                            <option value="Drinks">Drinks</option>
                        </select>
                    </div>


                    <div class="input-group">
                        <label>Dish Image</label>
                        <input type="file" id="dishImage" accept="image/*">
                        <img id="imagePreview" src="" alt=""
                            style="display:none; margin-top:0.5rem; max-width:100%; max-height:150px; border-radius:8px; object-fit:cover;">
                    </div>

                    <div class="modal-buttons">
                        <button type="button" onclick="closeModal()">
                            Cancel
                        </button>

                        <button type="submit" class="btn-primary" id="saveBtn">
                            Save Dish
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <script type="module" src="../header.js"></script>
        <script type="module" src="menu.js"></script>
        
</body>

</html>
